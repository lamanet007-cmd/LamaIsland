<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Island CZ/SK | Oficiální Fanouškovský Hub</title>
    <!-- FontAwesome Pro Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff007a;
            --primary-glow: rgba(255, 0, 122, 0.4);
            --secondary: #00f0ff;
            --accent: #ffeb3b;
            --bg-dark: #070919;
            --card-bg: rgba(18, 24, 54, 0.75);
            --card-border: rgba(255, 0, 122, 0.25);
            --text-main: #ffffff;
            --text-sub: #a0a7c4;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 122, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(0, 240, 255, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* Navigace */
        header {
            background: rgba(7, 9, 25, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 0, 122, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--secondary);
            text-shadow: 0 0 8px var(--secondary);
        }

        /* Hero Banner */
        .hero {
            padding: 70px 0 40px;
            text-align: center;
            position: relative;
        }

        .hero-badge {
            background: rgba(255, 0, 122, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 30%, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto 35px;
        }

        /* Countdown */
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .time-num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--secondary);
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* Sekce Title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 50px 0 25px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .section-title i {
            color: var(--primary);
        }

        /* Grid Layouts */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Karty soutěžících */
        .islander-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .islander-card:hover {
            transform: translateY(-7px);
            border-color: var(--secondary);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
        }

        .islander-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #101432;
        }

        .islander-info {
            padding: 20px;
        }

        .islander-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .islander-meta {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .status-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }

        .status-in {
            background: rgba(0, 240, 255, 0.2);
            color: var(--secondary);
            border: 1px solid var(--secondary);
        }

        .status-out {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }

        /* Hlasování Páry */
        .couple-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .couple-names {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.08);
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.8s ease;
        }

        .vote-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* Tlačítka */
        .btn {
            background: linear-gradient(135deg, var(--primary), #d00063);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 5px 20px var(--primary-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(255, 0, 122, 0.7);
        }

        .btn:disabled {
            background: #252a48;
            color: #6c7293;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Interaktivní Mapa Vily */
        .villa-map {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .zone-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .zone-btn i {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .zone-btn:hover, .zone-btn.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--secondary);
            transform: translateY(-3px);
        }

        .zone-display {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid var(--primary);
        }

        /* Chat */
        .chat-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
        }

        .chat-box {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 18px;
            border-radius: 14px;
            border-left: 3px solid var(--primary);
        }

        .chat-author {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.85rem;
        }

        .chat-input-group {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 12px;
        }

        .input-styled {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px 18px;
            border-radius: 25px;
            outline: none;
        }

        .input-styled:focus {
            border-color: var(--secondary);
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding: 40px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

            .hero h1 { font-size: 2.2rem; }
            .nav-links { display: none; }
            .chat-input-group { grid-template-columns:

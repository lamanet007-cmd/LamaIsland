<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Island CZ/SK 2026 | Fanouškovský Hub</title>
    <!-- FontAwesome Pro Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff007a;
            --primary-glow: rgba(255, 0, 122, 0.45);
            --secondary: #00f0ff;
            --accent: #ffeb3b;
            --bg-dark: #070919;
            --card-bg: rgba(18, 24, 54, 0.85);
            --card-border: rgba(255, 0, 122, 0.25);
            --text-main: #ffffff;
            --text-sub: #a0a7c4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 122, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(0, 240, 255, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* Navigace */
        header {
            background: rgba(7, 9, 25, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 0, 122, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--secondary);
            text-shadow: 0 0 8px var(--secondary);
        }

        /* Hero Banner */
        .hero {
            padding: 60px 0 30px;
            text-align: center;
            position: relative;
        }

        .hero-badge {
            background: rgba(255, 0, 122, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 30%, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto 35px;
        }

        /* Sekce Title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0 25px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .section-title i {
            color: var(--primary);
        }

        /* Grid Layouts */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 25px;
        }

        /* Karty soutěžících */
        .islander-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .islander-card:hover {
            transform: translateY(-7px);
            border-color: var(--secondary);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
        }
